[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-healthcare-api"
version = "0.1.0"
description = "FastAPI service for diagnostic bookings and simulated payments"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "PyJWT>=2.9",
    "pwdlib[argon2]>=0.2",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
